<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка — Особый маршрут</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232F7D6E'/><path d='M18 40l10-16 8 12 4-6 6 10z' fill='%23FFF'/></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <span class="topbar__logo" aria-hidden="true">⚙️</span>
    <span>
      <strong>Админка сайта</strong>
      <span class="topbar__sub" id="site-name">Особый маршрут</span>
    </span>
  </div>

  <div class="topbar__actions">
    <span class="save-state" id="save-state" role="status">Загрузка…</span>
    <a class="btn btn--ghost" id="open-site" href="/" target="_blank" rel="noopener">Открыть сайт ↗</a>
    <button class="btn" id="save-btn" type="button" disabled>Сохранить</button>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Разделы админки"></nav>
  <main class="work" id="work" tabindex="-1">
    <p class="loading">Загружаем контент…</p>
  </main>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="admin.js"></script>
</body>
</html>
